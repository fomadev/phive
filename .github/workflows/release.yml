name: GitHub Release with VSIX Asset

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create GitHub Release and Publish VSIX
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build production package
        run: npm run package

      - name: Create VSIX package
        run: npx @vscode/vsce package

      - name: Locate generated VSIX asset
        run: |
          VSIX_FILE=$(ls *.vsix | head -n 1)
          echo "Found VSIX asset: $VSIX_FILE"
          echo "VSIX_FILE=$VSIX_FILE" >> $GITHUB_ENV

      - name: Create GitHub Release & upload VSIX asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: ${{ env.VSIX_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
